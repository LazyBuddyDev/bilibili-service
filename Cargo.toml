[package]
name = "bilibili-service"
version = "0.1.2"
edition = "2024"
license = "MIT"

[workspace]

[dependencies]
serde_json = "=1.0.154"
ureq = { version = "=3.5.1", default-features = false, features = ["native-tls", "win-system-proxy"] }
md-5 = "=0.10.6"
base64 = "=0.23.1"
scraper = { version = "=0.27.0", default-features = false }
qrcodegen = "=1.8.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Credentials", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
